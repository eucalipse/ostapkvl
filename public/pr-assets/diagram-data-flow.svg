    <text x="616" y="151" text-anchor="middle" font-size="14" letter-spacing="1.3" fill="#69707A">SHARED STORE</text>
    <text x="920" y="151" font-size="14" letter-spacing="1.3" fill="#69707A">OUTPUTS</text>

