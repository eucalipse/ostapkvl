      <path d="M0,0 L10,5 L0,10 Z" fill="#2E4EC4"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ECEEF1"/>
  <text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">One shared memory, three ways to act</text>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="48" y="92" font-size="17" fill="#69707A">Connected tools feed the assistant’s working context</text>
