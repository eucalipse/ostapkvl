<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">One shared memory, three ways to act</title>
  <desc id="desc">Gmail, Calendar, GitHub, Notion, and Slack feed a central Postgres store with vector embeddings. The shared store supplies a proactive queue, chat, and CRM and tasks.</desc>
