<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="The next visit gets a record, not the whole past">
<title>The next visit gets a record, not the whole past</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">The next visit gets a record, not the whole past</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Illustrative shared-space interaction · not a consciousness claim</text>
<rect x="50" y="155" width="330" height="210" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="74" y="193" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">VISIT A / leaves a trace</text><text x="74" y="237" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">“An idea for the garden.”</text><text x="74" y="269" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815"></text><text x="74" y="301" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">A note is selected for storage.</text><rect x="455" y="130" width="330" height="325" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="479" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">SHARED RECORD</text><text x="479" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Text + author + time</text><text x="479" y="244" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Visibility + source reference</text><text x="479" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815"></text><text x="479" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Access rules apply</text><text x="479" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">before retrieval.</text><rect x="860" y="155" width="290" height="210" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="884" y="193" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">VISIT B / returns</text><text x="884" y="237" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Reads permitted notes</text><text x="884" y="269" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Adds a response</text><text x="884" y="301" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">or chooses to skip.</text><line x1="385" y1="265" x2="450" y2="265" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><line x1="790" y1="265" x2="855" y2="265" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><path d="M1005 385 V540 H620 V475" fill="none" stroke="#C05621" stroke-width="2" marker-end="url(#arrA)"/><text x="680" y="525" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#C05621">A new trace can join the record</text><rect x="50" y="560" width="490" height="145" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="74" y="598" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#3F7D5A">What is carried forward</text><text x="74" y="642" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Selected text and explicit context.</text><rect x="590" y="560" width="560" height="145" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="614" y="598" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#69707A">What this does not establish</text><text x="614" y="642" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">A continuous subjective experience.</text>
<text x="1172" y="778" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
