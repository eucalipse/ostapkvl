<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Route work. Protect the scarce attention.">
<title>Route work. Protect the scarce attention.</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E675F"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF8F4"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Route work. Protect the scarce attention.</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Qualitative policy map · no percentages or throughput claims</text>
<rect x="260" y="125" width="680" height="90" rx="14" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="290" y="163" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#C05621">INCOMING WORK</text><text x="290" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#1A1815">Check evidence, permissions, impact and uncertainty</text><rect x="90" y="270" width="1020" height="118" rx="14" fill="#fff" stroke="#3F7D5A" stroke-width="1.5"/><text x="118" y="304" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3F7D5A">ROUTINE + REVERSIBLE</text><text x="118" y="343" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Policy allows execution</text><text x="600" y="343" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Log result; sample for quality</text><rect x="90" y="415" width="1020" height="118" rx="14" fill="#fff" stroke="#B7791F" stroke-width="1.5"/><text x="118" y="449" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#B7791F">UNCERTAIN + LOW IMPACT</text><text x="118" y="488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Prepare or classify cautiously</text><text x="600" y="488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Sample, clarify, or escalate</text><rect x="90" y="560" width="1020" height="118" rx="14" fill="#fff" stroke="#B23B2E" stroke-width="1.5"/><text x="118" y="594" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#B23B2E">HIGH IMPACT OR CONFLICT</text><text x="118" y="633" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Prepare a decision packet</text><text x="600" y="633" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Human verifies and authorizes</text><line x1="600" y1="219" x2="600" y2="254" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="90" y="745" width="1020" height="75" rx="14" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="116" y="778" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">Monitoring can send any category back to review.</text><text x="116" y="805" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675F">A routing policy is revisable; autonomy is not permanent.</text>
<text x="1172" y="878" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
