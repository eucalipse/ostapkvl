<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Where a reviewer's attention goes">
<title>Where a reviewer's attention goes</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E675F"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF8F4"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Where a reviewer's attention goes</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Same request, two screens.</text>
<text x="48" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1A1815">Review everything</text><rect x="260" y="170" width="856" height="70" rx="8" fill="#6E675F" fill-opacity="0.18" stroke="#6E675F" stroke-opacity="0.55"/><text x="274" y="200" font-family="Menlo, Consolas, monospace" font-size="17" fill="#6E675F" font-weight="600">100%</text><text x="274" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1815">Every field, every request, same care</text><text x="48" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1A1815">Attention first</text><rect x="260" y="340" width="494.79999999999995" height="70" rx="8" fill="#3F7D5A" fill-opacity="0.16" stroke="#3F7D5A" stroke-opacity="0.55"/><text x="274" y="370" font-family="Menlo, Consolas, monospace" font-size="17" fill="#3F7D5A" font-weight="600">58%</text><text x="274" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1815">Folded: matches its source</text><rect x="758.8" y="340" width="228.20000000000002" height="70" rx="8" fill="#B7791F" fill-opacity="0.16" stroke="#B7791F" stroke-opacity="0.55"/><text x="772.8" y="370" font-family="Menlo, Consolas, monospace" font-size="17" fill="#B7791F" font-weight="600">27%</text><text x="772.8" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1815">Glance: guessed or optional</text><rect x="991" y="340" width="125" height="70" rx="8" fill="#B23B2E" fill-opacity="0.16" stroke="#B23B2E" stroke-opacity="0.55"/><text x="1005" y="370" font-family="Menlo, Consolas, monospace" font-size="17" fill="#B23B2E" font-weight="600">15%</text><text x="1005" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1815">Decide</text><text x="48" y="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#6E675F">Share of fields on a typical request, and where the reviewer's minutes go. Illustrative numbers.</text><text x="48" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#6E675F">The point: most of the screen should not ask for attention at all.</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
