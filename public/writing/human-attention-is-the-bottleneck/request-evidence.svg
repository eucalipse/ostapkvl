<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-label="Follow the evidence to the decision.">
<title>Follow the evidence to the decision.</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Follow the evidence to the decision.</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">One request, two uncertainties · illustrative example, not production data</text>
<rect x="48" y="130" width="1104" height="150" rx="14" fill="#F3F5F7" stroke="#D9DEE4" stroke-width="1.5"/><text x="74" y="172" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#C05621">01 / INCOMING REQUEST</text><text x="74" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1A1815">“Please start early next month. Use the bank details attached.”</text><text x="74" y="253" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#69707A">Synthetic supplier email · attachment is a separate source</text><line x1="600" y1="286" x2="600" y2="320" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><rect x="48" y="330" width="534" height="230" rx="14" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><rect x="618" y="330" width="534" height="230" rx="14" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="74" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#C05621">02 / WHAT THE AGENT PROPOSED</text><text x="74" y="420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Start date: November 1</text><text x="74" y="462" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Bank account: …4821</text><text x="74" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#69707A">Both require evidence checks</text><text x="644" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#C05621">03 / WHAT THE EVIDENCE SUPPORTS</text><text x="644" y="420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">Date: not specified precisely</text><text x="644" y="462" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">Existing record: …9017</text><text x="644" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#69707A">A proposal is not a verified value</text><line x1="600" y1="570" x2="600" y2="608" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><rect x="48" y="620" width="1104" height="173" rx="14" fill="#FFF0E9" stroke="#C05621" stroke-width="1.5"/><text x="74" y="665" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#C05621">04 / THE HUMAN DECISION</text><text x="74" y="711" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1A1815">Confirm the intended date. Independently verify the account change.</text><text x="74" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#69707A">Saving remains blocked. Resolving the conflict does not itself authorize payment.</text>
<text x="1172" y="848" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
