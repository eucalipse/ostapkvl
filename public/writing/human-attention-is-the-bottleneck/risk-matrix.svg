<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-label="Confidence is only half the decision.">
<title>Confidence is only half the decision.</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4EC4"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Confidence is only half the decision.</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Illustrative placements · impact depends on your product and controls</text>
<rect x="150" y="155" width="465" height="255" rx="14" fill="#ECEEF1" stroke="#B23B2E" stroke-width="1.5"/><text x="176" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#B23B2E">HIGH IMPACT</text><text x="176" y="246" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Payment recipient</text><text x="176" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Verified source, still needs</text><text x="176" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">independent approval.</text><text x="176" y="379" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#69707A">Evidence agrees</text><rect x="650" y="155" width="465" height="255" rx="14" fill="#ECEEF1" stroke="#B23B2E" stroke-width="1.5"/><text x="676" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#B23B2E">HIGH IMPACT</text><text x="676" y="246" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Conflicting bank details</text><text x="676" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Do not pick a winner.</text><text x="676" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Verify before authorizing.</text><text x="676" y="379" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#69707A">Evidence incomplete / conflicting</text><rect x="150" y="440" width="465" height="255" rx="14" fill="#ECEEF1" stroke="#3F7D5A" stroke-width="1.5"/><text x="176" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3F7D5A">LOW IMPACT</text><text x="176" y="531" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Internal email label</text><text x="176" y="583" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Clear routing rule.</text><text x="176" y="616" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Apply and log the result.</text><text x="176" y="664" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#69707A">Evidence agrees</text><rect x="650" y="440" width="465" height="255" rx="14" fill="#ECEEF1" stroke="#B7791F" stroke-width="1.5"/><text x="676" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#B7791F">LOW IMPACT</text><text x="676" y="531" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#1A1815">Ambiguous internal tag</text><text x="676" y="583" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Reversible classification.</text><text x="676" y="616" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Sample or ask when needed.</text><text x="676" y="664" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#69707A">Evidence incomplete / conflicting</text><line x1="130" y1="715" x2="1130" y2="715" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><text x="150" y="753" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#69707A">Lower uncertainty</text><text x="855" y="753" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#69707A">Higher uncertainty</text><text x="80" y="460" transform="rotate(-90 80 460)" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#69707A">Cost of a mistake →</text><text x="150" y="812" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">Policy can require approval even when the evidence is clear.</text>
<text x="1172" y="868" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
