e-width="3"/><text x="764" y="409.33333333333326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#B23B2E" font-weight="600">Person decides, AI prepares</text><rect x="150" y="130" width="900" height="440" rx="0" fill="none" stroke="#E3DED6" stroke-width="1.5"/><circle cx="240" cy="517.2" r="7" fill="#1A1815"/><text x="253" y="523.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Tag an incoming email</text><circle cx="258" cy="363.20000000000005" r="7" fill="#1A1815"/><text x="271" y="369.20000000000005" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Copy a value that matches its quote</text><circle cx="573" cy="482" r="7" fill="#1A1815"/><text x="586" y="488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Guess a missing date</text><circle cx="555" cy="350" r="7" fill="#1A1815"/><text x="568" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Draft a reply to a customer</text><circle cx="816" cy="323.59999999999997" r="7" fill="#1A1815"/><text x="829" y="329.59999999999997" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Choose between two sources</text><circle cx="240" cy="218" r="7" fill="#1A1815"/><text x="253" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Send a signed document</text><circle cx="573" cy="191.60000000000002" r="7" fill="#1A1815"/><text x="586" y="197.60000000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Change a supplier's bank details</text><text x="600" y="614" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F" text-anchor="middle">How unsure the AI is  →</text><text x="104" y="350" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font