<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Timeout is not evidence that nothing happened</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Schematic timeline · bar widths do not represent measured latency</text>
<text x="55" y="187" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Caller</text><path d="M245 180L1120 180" stroke="#E3DED6" fill="none" stroke-width="2"/><text x="55" y="275" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Provider</text><path d="M245 268L1120 268" stroke="#E3DED6" fill="none" stroke-width="2"/><text x="55" y="363" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Response</text><path d="M245 356L1120 356" stroke="#E3DED6" fill="none" stroke-width="2"/><text x="55" y="451" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Recovery</text><path d="M245 444L1120 444" stroke="#E3DED6" fill="none" stroke-width="2"/><rect x="260" y="163" width="160" height="34" rx="4" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="268" y="187" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815">op-17: send</text><rect x="420" y="251" width="160" height="34" rx="4" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="428" y="275" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815">effect committed</text><rect x="580" y="339" width="160" height="34" rx="4" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="588" y="363" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815">response lost</text><rect x="740" y="427" width="320" height="34" rx="4" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="748" y="451" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815">query op-17 before retry</text><text x="55" y="604" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#6E675F">Reuse the operation identity. Reconcile an unknown outcome before another side effect.</text>
