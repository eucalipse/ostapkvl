rial, sans-serif" font-size="19" fill="#1A1815">No silent fallback</text><text x="55" y="604" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#69707A">Validate permissions and arguments at execution time, not only during model planning.</text>
