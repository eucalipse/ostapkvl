<rect x="130" y="130" width="940" height="570" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><line x1="155" y1="215" x2="1040" y2="215" stroke="#E3DED6"/><line x1="155" y1="280" x2="1040" y2="280" stroke="#E3DED6"/><line x1="155" y1="345" x2="1040" y2="345" stroke="#E3DED6"/><line x1="155" y1="410" x2="1040" y2="410" stroke="#E3DED6"/><line x1="155" y1="475" x2="1040" y2="475" stroke="#E3DED6"/><line x1="155" y1="540" x2="1040" y2="540" stroke="#E3DED6"/><line x1="155" y1="605" x2="1040" y2="605" stroke="#E3DED6"/><text x="170" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1A1815">MEMORY NOTE / meeting preference</text><text x="170" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675F">Original words</text><text x="425" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">I prefer early meetings.</text><text x="170" y="315" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675F">Scope</text><text x="425" y="315" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Work meetings</text><text x="170" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675F">Status</text><text x="425" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Replaced for this month</text><text x="170" y="445" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675F">Correction</text><text x="425" y="445" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Keep mornings free this month.</text><text x="170" y="510" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675F">Still uncertain</text><text x="425" y="510" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Does the old preference resume later?</text><text x="170" y="575" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675F">Next action</text><text x="425" y="575" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Ask before reusing it</text>
<text x="1172" y="778" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
