<text x="60" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#6E675F">EARLIER</text><rect x="60" y="180" width="490" height="130" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="84" y="218" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">You</text><text x="84" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">I prefer early meetings.</text><text x="650" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#C05621">LATER</text><rect x="650" y="180" width="490" height="130" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="674" y="218" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">You</text><text x="674" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Keep mornings free this month.</text><line x1="300" y1="330" x2="300" y2="425" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><line x1="900" y1="330" x2="900" y2="425" stroke="#6E675F" stroke-width="2" marker-end="url(#arrA)"/><rect x="60" y="445" width="490" height="170" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="84" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#B23B2E">Stale recommendation</text><text x="84" y="527" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">How about 8:30 a.m.?</text><text x="84" y="559" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">The old note is accurate,</text><text x="84" y="591" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">but no longer applicable.</text><rect x="650" y="445" width="490" height="170" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="674" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#3F7D5A">Current recommendation</text><text x="674" y="527" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Would 2 p.m. work?</text><text x="674" y="559" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Uses the later, scoped update.</text><text x="60" y="710" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1A1815">The correction changes which evidence should guide the answer.</text>
