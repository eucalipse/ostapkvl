<title>A plausible explanation still needs a distinguishing test</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">A plausible explanation still needs a distinguishing test</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Synthetic CSV investigation · evidence and interpretation stay separate</text>
<rect x="48" y="130" width="430" height="410" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="72" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#C05621">OBSERVATION / fixture A</text><text x="72" y="213" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A">Input field</text><text x="72" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1A1815">Acme, Inc.</text><text x="72" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A">Exported field</text><text x="72" y="343" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1A1815">"Acme, Inc."</text><text x="72" y="407" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">One observation.</text><text x="72" y="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Two possible explanations.</text><line x1="478" y1="265" x2="562" y2="220" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><line x1="478" y1="340" x2="562" y2="370" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><rect x="580" y="145" width="570" height="120" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="604" y="181" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#C05621">Hypothesis A</text><text x="604" y="219" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#1A1815">The exporter quotes every field.</text><rect x="580" y="300" width="570" height="120" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="604" y="336" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#C05621">Hypothesis B</text><text x="604" y="374" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#1A1815">It quotes fields containing delimiters.</text><rect x="580" y="460" width="570" height="115" rx="10" fill="#F3F5F7" stroke="#D9DEE4" stroke-width="1.5"/><text x="604" y="496" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#C05621">NEXT PROBE: a plain name</text><text x="604" y="536" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#1A1815">A predicts "Acme"     B predicts Acme</text><text x="48" y="599" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A">Keep both hypotheses until an observation distinguishes them.</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
