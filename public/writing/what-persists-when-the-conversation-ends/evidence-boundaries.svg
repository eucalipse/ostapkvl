<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="What would this observation actually show?">
<title>What would this observation actually show?</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">What would this observation actually show?</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">A conceptual evidence map · not a test result or hierarchy of minds</text>
<rect x="48" y="135" width="1104" height="180" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="76" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#C05621">01 / RETAINED INFORMATION</text><text x="76" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1A1815">The system recalls a saved preference.</text><text x="76" y="252" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#69707A">Inspect: stored record, access rules, retrieval input.</text><text x="76" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#69707A">Does not establish: an experience of remembering.</text><rect x="48" y="340" width="1104" height="180" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="76" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#C05621">02 / BEHAVIORAL CONTINUITY</text><text x="76" y="417" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1A1815">A correction changes a later answer.</text><text x="76" y="457" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#69707A">Test: controlled conditions, repeated trials, scoring.</text><text x="76" y="491" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#69707A">Does not establish: a persistent subjective self.</text><rect x="48" y="545" width="1104" height="180" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="76" y="580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#C05621">03 / INTERNAL-STATE REPORTS</text><text x="76" y="622" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1A1815">A model reports an experimentally altered state.</text><text x="76" y="662" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#69707A">Test: interventions, controls, mechanism analysis.</text><text x="76" y="696" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#69707A">Does not establish by itself: subjective experience.</text><text x="48" y="810" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1A1815">Different observations. Different questions. No single consciousness score.</text>
<text x="1172" y="878" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
