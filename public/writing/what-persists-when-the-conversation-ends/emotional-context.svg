<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="A difficult day is not a permanent identity">
<title>A difficult day is not a permanent identity</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E675F"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF8F4"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">A difficult day is not a permanent identity</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Illustrative mechanism · example data, not measured results</text>
<rect x="55" y="140" width="1090" height="105" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="77" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">SOURCE · Monday, one conversation</text><text x="77" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">“I’m exhausted today. Please keep this short.”</text><line x1="310" y1="250" x2="310" y2="295" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><line x1="890" y1="250" x2="890" y2="295" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="55" y="305" width="510" height="180" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="77" y="341" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">SAVE THE STATEMENT</text><text x="77" y="385" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Scope: this conversation</text><text x="77" y="417" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Evidence: the person’s own words</text><text x="77" y="449" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Later use: check whether it still applies</text><rect x="635" y="305" width="510" height="180" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="657" y="341" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">DO NOT PROMOTE AN INFERENCE</text><text x="657" y="385" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">“This person is always overwhelmed”</text><text x="657" y="417" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">No supporting statement for “always”</text><text x="657" y="449" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">A generated label is not a durable fact</text><path d="M660 440L1115 340" stroke="#B23B2E" fill="none" stroke-width="2"/><text x="55" y="604" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#6E675F">Response choice: be brief now. Future recall still needs a relevance check.</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
