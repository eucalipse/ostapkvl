<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Memory controls should describe actual behavior">
<title>Memory controls should describe actual behavior</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E675F"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF8F4"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Memory controls should describe actual behavior</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Illustrative mechanism · example data, not measured results</text>
<rect x="55" y="140" width="1090" height="85" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="77" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Memory record</text><text x="77" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815"></text><line x1="175" y1="230" x2="175" y2="285" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="70" y="295" width="250" height="195" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="92" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Inspect</text><text x="92" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Source and scope</text><text x="92" y="407" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">What was inferred</text><line x1="455" y1="230" x2="455" y2="285" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="350" y="295" width="250" height="195" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="372" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Correct</text><text x="372" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Mark superseded</text><text x="372" y="407" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Keep provenance</text><line x1="735" y1="230" x2="735" y2="285" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="630" y="295" width="250" height="195" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="652" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Pause use</text><text x="652" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Define what stops</text><text x="652" y="407" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Explain retention</text><line x1="1015" y1="230" x2="1015" y2="285" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="910" y="295" width="250" height="195" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="932" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Export</text><text x="932" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Portable record</text><text x="932" y="407" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Document limits</text><text x="55" y="604" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#6E675F">Design proposal: these are separate capabilities, not a claim that every one is implemented.</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
