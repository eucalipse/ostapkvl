<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Prove that a reply actually arrives">
<title>Prove that a reply actually arrives</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Prove that a reply actually arrives</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">An end-to-end canary sends a real-looking request through the whole path.</text>
<rect x="60" y="140" width="300" height="96" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="80" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1A1815">Scheduler</text><text x="80" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Every hour, on a timer</text><rect x="450" y="140" width="300" height="96" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="470" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1A1815">Synthetic message</text><text x="470" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Mentions the assistant + unique ID</text><rect x="840" y="140" width="300" height="96" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="860" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1A1815">Integration</text><text x="860" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Same path as a real request</text><rect x="840" y="330" width="300" height="96" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="860" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1A1815">Assistant</text><text x="860" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Does a harmless test task</text><rect x="450" y="330" width="300" height="96" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="470" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1A1815">Reply</text><text x="470" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Appears where people look</text><rect x="60" y="330" width="300" height="96" rx="10" fill="#fff" stroke="#C05621" stroke-width="2"/><text x="80" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#C05621">Checker</text><text x="80" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Finds the reply with that ID</text><line x1="364" y1="188" x2="444" y2="188" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="754" y1="188" x2="834" y2="188" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="990" y1="240" x2="990" y2="324" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="836" y1="378" x2="756" y2="378" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="446" y1="378" x2="366" y2="378" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="150" y1="326" x2="150" y2="242" stroke="#69707A" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 5"/><text x="160" y="288" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A">next run</text><rect x="60" y="500" width="300" height="80" rx="10" fill="#fff" stroke="#B23B2E" stroke-width="2"/><text x="80" y="534" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#B23B2E" font-weight="600">No reply in time? Alert</text><text x="80" y="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">through a different channel</text><line x1="270" y1="430" x2="270" y2="494" stroke="#B23B2E" stroke-width="2" marker-end="url(#arr)"/><text x="840" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Ignores its own replies, so it never loops</text><text x="450" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#69707A">Check the destination, not a "sent" log</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
