<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Approval is attached to evidence at a revision">
<title>Approval is attached to evidence at a revision</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4EC4"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Approval is attached to evidence at a revision</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Illustrative mechanism · example data, not measured results</text>
<rect x="55" y="140" width="510" height="370" rx="10" fill="#ECEEF1" stroke="#D9DEE4" stroke-width="1.5"/><text x="77" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#2E4EC4">Review packet · revision abc123</text><text x="77" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Intent: what behavior changes?</text><text x="77" y="252" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Invariant: what must stay true?</text><text x="77" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Patch: exact code under review</text><text x="77" y="316" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Evidence: checks + counterexample</text><text x="77" y="348" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Decision: approve this revision</text><rect x="650" y="140" width="490" height="160" rx="10" fill="#ECEEF1" stroke="#D9DEE4" stroke-width="1.5"/><text x="672" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#2E4EC4">Another substantive edit</text><text x="672" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Revision def456</text><text x="672" y="252" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Previous approval is no longer enough</text><line x1="895" y1="310" x2="895" y2="385" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><rect x="650" y="395" width="490" height="115" rx="10" fill="#ECEEF1" stroke="#D9DEE4" stroke-width="1.5"/><text x="672" y="431" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#2E4EC4">Renew review</text><text x="672" y="475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Re-run checks on the combined change</text><text x="55" y="604" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#69707A">The diff is one part of the packet. Intent and failure cases make it reviewable.</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
