<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Retrieval needs more than a nearby vector">
<title>Retrieval needs more than a nearby vector</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E675F"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF8F4"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Retrieval needs more than a nearby vector</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Illustrative mechanism · example data, not measured results</text>
<rect x="45" y="155" width="340" height="210" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="67" y="191" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">A stored record</text><text x="67" y="235" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">text: original statement</text><text x="67" y="267" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">source: conversation + date</text><text x="67" y="299" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">scope: temporary preference</text><text x="67" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">status: active / superseded</text><line x1="395" y1="260" x2="485" y2="260" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="495" y="155" width="300" height="210" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="517" y="191" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Candidate recall</text><text x="517" y="235" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Related text is found</text><text x="517" y="267" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Check access and scope</text><text x="517" y="299" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Check newer corrections</text><text x="517" y="331" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Keep provenance</text><line x1="805" y1="260" x2="900" y2="260" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="910" y="155" width="245" height="210" rx="10" fill="#FAF8F4" stroke="#E3DED6" stroke-width="1.5"/><text x="932" y="191" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C05621">Use or omit</text><text x="932" y="235" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Relevant now?</text><text x="932" y="267" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Still supported?</text><text x="932" y="299" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1A1815">Safe to include?</text><rect x="105" y="430" width="990" height="100" rx="10" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="135" y="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1A1815">Similarity is not permission, freshness, or truth.</text><text x="135" y="505" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#6E675F">A close semantic match can still be the wrong memory to use.</text><text x="55" y="604" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#6E675F">Illustrative retrieval design. These checks are distinct from an embedding similarity score.</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
