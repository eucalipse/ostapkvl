<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Pick per step, not one model for everything.</text>
<line x1="140" y1="130" x2="140" y2="520" stroke="#D9DEE4"/><text x="140" y="546" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="middle">$0.00</text><line x1="328" y1="130" x2="328" y2="520" stroke="#D9DEE4"/><text x="328" y="546" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="middle">$0.01</text><line x1="516" y1="130" x2="516" y2="520" stroke="#D9DEE4"/><text x="516" y="546" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="middle">$0.02</text><line x1="704" y1="130" x2="704" y2="520" stroke="#D9DEE4"/><text x="704" y="546" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="middle">$0.03</text><line x1="891.9999999999999" y1="130" x2="891.9999999999999" y2="520" stroke="#D9DEE4"/><text x="891.9999999999999" y="546" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="middle">$0.04</text><line x1="1080" y1="130" x2="1080" y2="520" stroke="#D9DEE4"/><text x="1080" y="546" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="middle">$0.05</text><line x1="140" y1="520" x2="1080" y2="520" stroke="#D9DEE4"/><text x="128" y="525" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="end">80%</text><line x1="140" y1="422.5" x2="1080" y2="422.5" stroke="#D9DEE4"/><text x="128" y="427.5" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="end">85%</text><line x1="140" y1="325" x2="1080" y2="325" stroke="#D9DEE4"/><text x="128" y="330" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="end">90%</text><line x1="140" y1="227.5" x2="1080" y2="227.5" stroke="#D9DEE4"/><text x="128" y="232.5" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="end">95%</text><line x1="140" y1="130" x2="1080" y2="130" stroke="#D9DEE4"/><text x="128" y="135" font-family="Menlo, Consolas, monospace" font-size="13" fill="#69707A" text-anchor="end">100%</text><text x="610" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#69707A" text-anchor="middle">Cost per request</text><text x="70" y="325" font-size="16" fill="#69707A" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" transform="rotate(-90 70 325)">Fields right</text><line x1="140" y1="266.5" x2="1080" y2="266.5" stroke="#69707A" stroke-dasharray="6 6"/><text x="1080" y="258.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A" text-anchor="end">good enough for this step: 93%</text><path d="M234,442 L365.6,247 L704,188.5" stroke="#2E4EC4" stroke-width="2" fill="none"/><circle cx="234" cy="442" r="8" fill="#2E4EC4" /><text x="250" y="447" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Model A</text><circle cx="365.6" cy="247" r="11" fill="#2E4EC4" stroke="#1A1815" stroke-width="2"/><text x="381.6" y="252" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Model B</text><circle cx="516" cy="305.5" r="8" fill="#69707A" /><text x="532" y="310.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Model C</text><circle cx="704" cy="188.5" r="8" fill="#2E4EC4" /><text x="720" y="193.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Model D</text><circle cx="985.9999999999999" cy="208" r="8" fill="#69707A" /><text x="1001.9999999999999" y="213" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1815">Model E</text><text x="381.6" y="275" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2E4EC4">cheapest good-enough model wins</text><text x="48" y="640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A">Illustrative numbers. Invented values and source-quote checks are a separate gate.</text>
