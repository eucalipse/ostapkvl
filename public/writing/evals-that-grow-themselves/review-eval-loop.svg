<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Confirmed work becomes the next test">
<title>Confirmed work becomes the next test</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Confirmed work becomes the next test</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Review produces the labels. The gate makes them count before anything ships.</text>
<rect x="60" y="130" width="300" height="90" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="80" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">A person confirms</text><text x="80" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">a request in review</text><rect x="450" y="130" width="300" height="90" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="470" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">Confirmed values saved</text><text x="470" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">as a labeled example</text><rect x="840" y="130" width="300" height="90" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="860" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">The test set grows</text><text x="860" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">by itself</text><rect x="840" y="340" width="300" height="90" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="860" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">Every prompt or model</text><text x="860" y="402" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1A1815">change re-runs the eval</text><polygon points="600,327 685,385 600,443 515,385" fill="#fff" stroke="#C05621" stroke-width="2"/><text x="600" y="391" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#C05621" text-anchor="middle">CI gate</text><rect x="60" y="340" width="300" height="90" rx="10" fill="#fff" stroke="#3F7D5A" stroke-width="2"/><text x="80" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#3F7D5A">Ship</text><rect x="500" y="500" width="200" height="60" rx="10" fill="#fff" stroke="#B23B2E" stroke-width="2"/><text x="600" y="536" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#B23B2E" text-anchor="middle">Fix the change</text><line x1="364" y1="175" x2="444" y2="175" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="754" y1="175" x2="834" y2="175" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="990" y1="224" x2="990" y2="334" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="836" y1="385" x2="690" y2="385" stroke="#69707A" stroke-width="2" marker-end="url(#arrA)"/><line x1="512" y1="385" x2="366" y2="385" stroke="#3F7D5A" stroke-width="2" marker-end="url(#arr)"/><text x="440" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#3F7D5A" text-anchor="middle">pass</text><line x1="600" y1="446" x2="600" y2="494" stroke="#B23B2E" stroke-width="2" marker-end="url(#arr)"/><text x="612" y="476" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#B23B2E">fail</text><line x1="706" y1="530" x2="990" y2="436" stroke="#69707A" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 5"/><line x1="210" y1="334" x2="210" y2="226" stroke="#69707A" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 5"/><text x="222" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A">new requests</text><text x="450" y="252" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#69707A">keep the original source with the answer</text>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
