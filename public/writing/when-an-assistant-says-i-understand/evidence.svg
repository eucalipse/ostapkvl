<title>What can we check this claim against?</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">What can we check this claim against?</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">A guide to evidence, not a consciousness ranking</text>
<rect x="45" y="150" width="355" height="470" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="67" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#C05621">A self-report</text><text x="67" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1A1815">“I am confused.”</text><text x="67" y="345" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1A1815">Compare with behavior.</text><text x="67" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1A1815">What produced this wording?</text><rect x="430" y="150" width="355" height="470" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="452" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#C05621">An application trace</text><text x="452" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1A1815">Retrieved note + tool result</text><text x="452" y="345" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1A1815">Inspect inputs and execution.</text><text x="452" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1A1815">Does not expose model internals.</text><rect x="815" y="150" width="355" height="470" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="837" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#C05621">A controlled intervention</text><text x="837" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1A1815">Change an internal representation</text><text x="837" y="345" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1A1815">Compare reports with the change.</text><text x="837" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1A1815">Interpret within the experiment.</text><text x="60" y="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1A1815">More inspectable evidence still needs an interpretation.</text>
<text x="1172" y="778" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
