<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Make the source of familiarity inspectable</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Illustrative UI · synthetic content</text>
<rect x="70" y="130" width="1060" height="570" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><rect x="70" y="130" width="1060" height="65" rx="10" fill="#F3F5F7" stroke="#D9DEE4" stroke-width="1.5"/><text x="100" y="173" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#69707A">ASSISTANT / preference controls</text><text x="110" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" fill="#1A1815">Would a shorter answer help today?</text><text x="110" y="295" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#69707A">You can change this preference at any time.</text><rect x="110" y="335" width="980" height="150" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="134" y="373" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">Saved preference used</text><text x="134" y="417" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">“Please keep the explanation brief.”</text><text x="134" y="449" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Source: your earlier message · scope: this conversation</text><rect x="110" y="530" width="285" height="60" rx="10" fill="#F3F5F7" stroke="#D9DEE4" stroke-width="1.5"/><text x="132" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#1A1815">Change preference</text><rect x="415" y="530" width="285" height="60" rx="10" fill="#F3F5F7" stroke="#D9DEE4" stroke-width="1.5"/><text x="440" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#1A1815">Remove note</text><rect x="720" y="530" width="340" height="60" rx="10" fill="#F3F5F7" stroke="#D9DEE4" stroke-width="1.5"/><text x="745" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#1A1815">Pause reminders</text><text x="110" y="650" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#69707A">No claim of waiting, worrying, or activity between sessions.</text>
