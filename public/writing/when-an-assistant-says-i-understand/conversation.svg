<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">A helpful reply can stay close to the request</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Invented dialogue</text>
<rect x="175" y="130" width="850" height="130" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="199" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">You</text><text x="199" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Can we keep this simple today?</text><line x1="400" y1="280" x2="300" y2="350" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><line x1="800" y1="280" x2="900" y2="350" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="55" y="375" width="520" height="215" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="79" y="413" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#3F7D5A">Responsive behavior</text><text x="79" y="457" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Of course. One thing at a time.</text><text x="79" y="489" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815"></text><text x="79" y="521" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Adjusts the response to the request.</text><rect x="625" y="375" width="520" height="215" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="649" y="413" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">Additional claims</text><text x="649" y="457" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">I know exactly how you feel.</text><text x="649" y="489" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">I have been thinking about you.</text><text x="649" y="521" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815"></text><text x="649" y="553" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">What activity or experience is implied?</text><text x="70" y="710" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#1A1815">Warm language and claims about an inner life are different design choices.</text>
