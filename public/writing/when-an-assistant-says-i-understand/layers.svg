<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Three questions that deserve separate answers">
<title>Three questions that deserve separate answers</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69707A"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4EC4"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ECEEF1"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Three questions that deserve separate answers</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Conceptual distinctions</text>
<circle cx="100" cy="202" r="35" fill="#2E4EC4" fill-opacity="0.25"/><text x="88" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">1</text><text x="170" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#2E4EC4">INTERFACE</text><text x="170" y="205" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1A1815">Shorter reply; a remembered preference.</text><text x="170" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#69707A">We can inspect the behavior.</text><line x1="170" y1="288" x2="1120" y2="288" stroke="#D9DEE4"/><circle cx="100" cy="387" r="35" fill="#2E4EC4" fill-opacity="0.25"/><text x="88" y="395" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">2</text><text x="170" y="347" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#2E4EC4">HUMAN RESPONSE</text><text x="170" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1A1815">This feels considerate or familiar.</text><text x="170" y="435" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#69707A">We can ask people about their experience.</text><line x1="170" y1="473" x2="1120" y2="473" stroke="#D9DEE4"/><circle cx="100" cy="572" r="35" fill="#F3F5F7" fill-opacity="0.25"/><text x="88" y="580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">3</text><text x="170" y="532" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#2E4EC4">MACHINE EXPERIENCE</text><text x="170" y="575" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1A1815">Is there something it feels like?</text><text x="170" y="620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#69707A">The observations above do not settle this.</text>
<text x="1172" y="778" font-family="Menlo, Consolas, monospace" font-size="15" fill="#69707A" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
