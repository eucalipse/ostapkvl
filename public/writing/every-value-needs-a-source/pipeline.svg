<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="From conversation to a checked form">
<title>From conversation to a checked form</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E675F"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF8F4"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">From conversation to a checked form</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Three steps run by the model and by code. The fourth belongs to a person.</text>
<rect x="48" y="150" width="190" height="54" rx="10" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="143" y="183" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815" text-anchor="middle">Emails</text><rect x="48" y="230" width="190" height="54" rx="10" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="143" y="263" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815" text-anchor="middle">Call notes</text><rect x="48" y="310" width="190" height="54" rx="10" fill="#F1ECE4" stroke="#E3DED6" stroke-width="1.5"/><text x="143" y="343" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815" text-anchor="middle">Records you trust</text><rect x="300" y="190" width="190" height="130" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="318" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1A1815">Detect</text><text x="318" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">Is there a request?</text><text x="318" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">One thread, many asks</text><line x1="492" y1="255" x2="516" y2="255" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="520" y="190" width="190" height="130" rx="10" fill="#fff" stroke="#1A1815" stroke-width="2"/><text x="538" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1A1815">Extract</text><text x="538" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">Each value + the exact</text><text x="538" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">words it came from</text><line x1="712" y1="255" x2="736" y2="255" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="740" y="190" width="190" height="130" rx="10" fill="#fff" stroke="#C05621" stroke-width="2"/><text x="758" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#C05621">Verify</text><text x="758" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">Is the quote real?</text><text x="758" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">Do sources agree?</text><line x1="932" y1="255" x2="956" y2="255" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="960" y="190" width="190" height="130" rx="10" fill="#fff" stroke="#3F7D5A" stroke-width="2"/><text x="978" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#3F7D5A">Review</text><text x="978" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">A person confirms</text><text x="978" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1A1815">what needs a decision</text><line x1="240" y1="177" x2="294" y2="220" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><line x1="240" y1="257" x2="294" y2="255" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><line x1="240" y1="337" x2="294" y2="290" stroke="#6E675F" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="390" width="850" height="120" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5" stroke-dasharray="6 6"/><text x="322" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1A1815">What comes out</text><text x="322" y="458" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815">A draft form. Every value links to its source. Guesses are marked as guesses.</text><text x="322" y="484" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1A1815">Missing values stay empty. Nothing is saved or sent until a person confirms.</text><line x1="1090" y1="320" x2="1090" y2="386" stroke="#6E675F" stroke-width="2" marker-end="url(#arrA)"/>
<text x="1172" y="653" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
