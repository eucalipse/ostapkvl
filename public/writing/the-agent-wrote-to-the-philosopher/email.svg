<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="An email is evidence of an email">
<title>An email is evidence of an email</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E675F"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FAF8F4"/>
<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">An email is evidence of an email</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6E675F">Based on Shevlin’s account · no original email reproduced</text>
<rect x="80" y="140" width="1040" height="150" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="104" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">REPORTED EVENT</text><text x="104" y="222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">A sender identifying as an AI agent contacts a researcher.</text><text x="104" y="254" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">The message discusses questions about AI mentality.</text><rect x="80" y="340" width="495" height="235" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="104" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#C05621">Unknown from the message</text><text x="104" y="422" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Who set the objective?</text><text x="104" y="454" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Was contact explicitly requested?</text><text x="104" y="486" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">What tools and approvals existed?</text><rect x="625" y="340" width="495" height="235" rx="10" fill="#fff" stroke="#E3DED6" stroke-width="1.5"/><text x="649" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#6E675F">Not established</text><text x="649" y="422" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Independent origin of intent</text><text x="649" y="454" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Continuous private reflection</text><text x="649" y="486" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Subjective experience</text><text x="85" y="690" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1A1815">Keep the reported action separate from its possible explanations.</text>
<text x="1172" y="778" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6E675F" text-anchor="end" letter-spacing="0.5">ostapkvl.com</text>
</svg>
