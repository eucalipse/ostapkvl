<text x="48" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1A1815">Keep the context beside the memorable phrase</text>
<text x="48" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#69707A">Proposed research record</text>
<rect x="55" y="145" width="510" height="200" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="79" y="183" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#2E4EC4">Before the response</text><text x="79" y="227" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Interface language and instructions</text><text x="79" y="259" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Previous messages and stored notes</text><text x="79" y="291" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Model version and tools available</text><rect x="635" y="145" width="510" height="200" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="659" y="183" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#2E4EC4">What was recorded</text><text x="659" y="227" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Full output, including ordinary replies</text><text x="659" y="259" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Any tool actions and results</text><text x="659" y="291" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">Timing and operator intervention</text><line x1="310" y1="365" x2="465" y2="445" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><line x1="890" y1="365" x2="735" y2="445" stroke="#69707A" stroke-width="2" marker-end="url(#arr)"/><rect x="200" y="470" width="800" height="190" rx="10" fill="#fff" stroke="#D9DEE4" stroke-width="1.5"/><text x="224" y="508" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#2E4EC4">Interpretation comes after the record</text><text x="224" y="552" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">A recollection can suggest where to look.</text><text x="224" y="584" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1A1815">It cannot replace the original exchange.</text>
