<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idioma · Türkçe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/turkce/styles.css">

<body>
  <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>

      <div>
        <div class="brand-title">Idioma</div>
        <div class="brand-sub">турецька · конспект</div>
      </div>

    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <script>window.IDIOMA_BASE='/turkce/';</script>
  <script src="/turkce/app.js"></script>

  <script src="/turkce/data/greetings.js"></script>
  <script src="/turkce/data/about.js"></script>
  <script src="/turkce/data/course.js"></script>
  <script src="/turkce/data/cafe.js"></script>
  <script src="/turkce/data/numbers.js"></script>
  <script src="/turkce/data/verbs.js"></script>
  <script src="/turkce/data/grammar.js"></script>
  <script src="/turkce/data/homework.js"></script>

  <script src="data/cafe.js"></script>

  <script src="data/verbs.js"></script>
