<!doctype html>
<html lang="uk" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF0EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Türkçe — Ostap Kovalisko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,50;1,9..144,300..700,50&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/turkce/styles.css">
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>

  <aside class="sidebar" id="sidebar">
    <a class="brand-site" id="brandSite" hidden></a>
    <div class="brand">
      <span class="brand-flag">T</span>
      <div>
        <div class="brand-title">Idioma</div>
        <div class="brand-sub">турецька · конспект</div>
      </div>
    </div>
    <input class="search" id="search" type="search" placeholder="Пошук фрази…" autocomplete="off">
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <main class="main" id="main">
    <div class="topbar"><div class="crumbs" id="crumbs"></div><div class="topbar-right"><nav class="hmenus" id="hmenus"></nav><button class="hbtn phrases-btn" id="phrasesBtn" type="button" hidden>Phrases</button><button class="hbtn today" id="todayBtn" type="button">Today</button><button class="hbtn" id="wordsBtn" type="button">Words</button><button class="hbtn" id="statsBtn" type="button">Stats</button><button class="theme-btn" id="themeBtn" title="Night / day">☾</button></div></div>
    <section class="stage" id="stage"></section>
    <aside class="phrases" id="phrases" hidden><div class="phead"><span class="k">phrases to learn · фрази</span><span class="n" id="phrasesN"></span><button class="mclose" id="phrasesClose" aria-label="Close">✕</button></div><input class="search" id="phrasesFilter" type="search" placeholder="filter · фільтр" autocomplete="off"><div id="phrasesList"></div></aside>
  </main>

  <div class="drawer" id="modal"><div class="dcard"><button class="mclose" aria-label="Close">✕</button><div id="modalBody"></div></div></div>

  <script>(() => { const q = new URLSearchParams(location.search); const seg = location.pathname.split('/').filter(Boolean).pop() || '';
    window.IDIOMA_VIEW = q.get('view') || (seg === 'teacher' ? 'teacher' : null);
    window.IDIOMA_SOLO = q.get('cat') || (seg === 'teacher' ? 'lessons' : (/^[a-z-]+$/.test(seg) ? seg : 'lessons')); })();</script>
  <script>window.IDIOMA_BASE='/turkce/';</script>
  <script src="/turkce/app.js"></script>
  <script src="/turkce/lang/tr.js"></script>
  <script src="/turkce/config.js"></script>
  <script src="/turkce/practice.js"></script>
  <script src="/turkce/sync.js"></script>
  <script src="/turkce/teacher.js"></script>
  <!-- Окрема сторінка однієї категорії (?cat=homework | lessons). Той самий код і дані, що в index.html; build-public збирає обидва. -->
  <!-- Дані: одна категорія = один файл. Нову тему додавай у відповідний файл, нову категорію — новим файлом + рядком нижче. -->
  <script src="/turkce/data/glossary.js"></script>
  <script src="/turkce/data/glossary-grammar-a1.js"></script>
  <script src="/turkce/data/glossary-health-clothes.js"></script>
  <script src="/turkce/data/glossary-home.js"></script>
  <script src="/turkce/data/glossary-city.js"></script>
  <script src="/turkce/data/glossary-countries-time.js"></script>
  <script src="/turkce/data/glossary-core.js"></script>
  <script src="/turkce/data/greetings.js"></script>
  <script src="/turkce/data/basics.js"></script>
  <script src="/turkce/data/core.js"></script>
  <script src="/turkce/data/about.js"></script>
  <script src="/turkce/data/countries.js"></script>
  <script src="/turkce/data/time.js"></script>
  <script src="/turkce/data/home.js"></script>
  <script src="/turkce/data/city.js"></script>
  <script src="/turkce/data/course.js"></script>
  <script src="/turkce/data/cafe.js"></script>
  <script src="/turkce/data/shopping.js"></script>
  <script src="/turkce/data/health.js"></script>
  <script src="/turkce/data/numbers.js"></script>
  <script src="/turkce/data/verbs.js"></script>
  <script src="/turkce/data/grammar.js"></script>
  <script src="/turkce/data/series.js"></script>
  <script src="/turkce/data/lessons.js"></script>
  <script>IDIOMA.start();</script>
</body>
</html>
